name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        include:
          - laravel: '10.*'
            testbench: '8.*'
            pest: '^2.0'
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 13 requires PHP 8.3.
          - php: '8.2'
            laravel: '13.*'
          # Laravel 10 predates PHP 8.4 and was never certified against it.
          - php: '8.4'
            laravel: '10.*'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3
          coverage: none

      # The security windows for Laravel 10 and 11 have closed, so Composer will
      # not load any 10.x or 11.x release at all. The package still supports
      # both and these legs still prove it, but the frameworks they test against
      # are unpatched — which is Composer's point, and why this is scoped to the
      # legs that need it rather than written into composer.json.
      - name: Allow the unpatched framework lines' security advisories
        if: matrix.laravel == '10.*' || matrix.laravel == '11.*'
        run: composer config --global policy.advisories.block false

      # Testbench 8 pins PHPUnit 10, which Pest 3 and 4 do not support.
      - name: Pin Pest to the PHPUnit 10 line
        if: matrix.pest != ''
        run: composer require --dev "pestphp/pest:${{ matrix.pest }}" --no-interaction --no-update

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --no-coverage
        env:
          CI: 'true'

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress

  style:
    runs-on: ubuntu-latest
    name: Pint
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
